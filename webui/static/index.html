<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paceghost WebUI - 校园跑多机控制台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>paceghost 控制台 <span>Route Studio 多机管理层</span></h1>
  <span><span id="conn-dot"></span><span id="last-refresh" style="color:var(--dim);font-size:12px">-</span></span>
  <div class="spacer"></div>
  <label style="color:var(--dim);font-size:12px;display:flex;gap:5px;align-items:center">
    <input type="checkbox" id="auto-refresh" checked style="accent-color:var(--acc)"> 自动刷新 2s
  </label>
  <button id="btn-events">事件日志</button>
</header>

<main>
  <div id="unreg-wrap" style="display:none">
    <div class="section-title">未登记设备 (adb 可见, 不在 devices.json)</div>
    <div id="unreg"></div>
  </div>

  <div class="section-title">已登记设备</div>
  <div id="grid"></div>
</main>

<div id="drawer">
  <div class="drawer-head">
    <div class="tabs" id="log-tabs"></div>
    <button class="small" id="drawer-close">关闭</button>
  </div>
  <div id="logbox">-</div>
</div>

<dialog id="dlg-confirm">
  <h3 id="confirm-title">确认</h3>
  <p class="confirm-text" id="confirm-text"></p>
  <div class="row">
    <button id="confirm-cancel">取消</button>
    <button class="danger" id="confirm-ok">确认执行</button>
  </div>
</dialog>

<dialog id="dlg-registry">
  <h3 id="reg-title">设备登记</h3>
  <div class="form">
    <label>别名 *</label><input id="reg-alias" placeholder="snake_case, 如 xiaomi">
    <label>USB 序列号 *</label><input id="reg-serial">
    <label>WiFi adb</label><input id="reg-wifi" placeholder="IP:5555, 可空">
    <label>RS 端口 *</label><input id="reg-port" type="number">
    <label>注入模式</label>
    <select id="reg-mode"><option value="testprovider">testprovider (cmd location)</option>
      <option value="settings">settings (jrpos/GpsFeed, 华为类)</option></select>
    <label>步频 (步/分)</label><input id="reg-cadence" type="number" value="131">
    <label>配速 (km/h)</label><input id="reg-speed" type="number" step="0.01" value="13.33">
    <label>人脸图路径</label><input id="reg-face" placeholder="work/face/xxx.png, 可空">
    <div class="row">
      <button id="reg-del" class="danger" style="display:none">删除条目</button>
      <button id="reg-cancel">取消</button>
      <button class="primary" id="reg-save">保存</button>
    </div>
  </div>
</dialog>

<div id="toasts"></div>
<input type="file" id="face-file" accept="image/png,image/jpeg" style="display:none">

<script src="/static/app.js"></script>
</body>
</html>
